name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version: "1.26.1"
                  check-latest: true
                  cache: true

            - name: Run tests
              run: go test -v -race -coverprofile=coverage.out ./...

            - name: SonarQube Cloud Scan
              if: ${{ env.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]' }}
              uses: SonarSource/sonarqube-scan-action@v8.1.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

            - name: Skip SonarQube Cloud Scan
              if: ${{ env.SONAR_TOKEN == '' || github.actor == 'dependabot[bot]' }}
              run: |
                  if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
                      echo "Skipping SonarQube Cloud Scan for Dependabot pull requests because repository secrets are not exposed."
                  else
                      echo "Skipping SonarQube Cloud Scan because SONAR_TOKEN is unavailable for this run."
                  fi

            - name: Upload coverage
              uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354
              with:
                  file: ./coverage.out
                  flags: unittests

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [test]
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version: "1.26.1"
                  check-latest: true
                  cache: true

            - name: Build binary
              run: |
                  make build
                  ./bin/kubecrsh --help

            - name: Upload artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: kubecrsh-binary
                  path: bin/kubecrsh
                  retention-days: 7
