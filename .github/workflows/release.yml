name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    packages: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Create Release
        runs-on: ubuntu-latest
        if: ${{ !contains(github.ref_name, '-') }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version: "1.26.1"
                  check-latest: true

            - name: Run tests
              run: go test ./...

            - name: Log in to GHCR
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8
              with:
                  distribution: goreleaser
                  version: latest
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Helm
              uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
              with:
                  version: v3.14.0

            - name: Update Chart Version
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  sed -i "s/^version:.*/version: ${VERSION}/" charts/kubecrsh/Chart.yaml
                  sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/kubecrsh/Chart.yaml

            - name: Lint Helm Chart
              run: helm lint charts/kubecrsh

            - name: Package Helm Chart
              run: |
                  helm package charts/kubecrsh -d dist/
                  ls -la dist/

            - name: Upload manifests and Helm chart
              uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
              with:
                  files: |
                      manifests/*.yaml
                      dist/*.tgz
                  generate_release_notes: true
