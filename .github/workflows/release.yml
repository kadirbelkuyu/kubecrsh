name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    packages: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Create Release
        runs-on: ubuntu-latest
        if: ${{ !contains(github.ref_name, '-') }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
              with:
                  go-version: "1.26.1"
                  check-latest: true

            - name: Run tests
              run: go test ./...

            - name: Log in to GHCR
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89
              with:
                  distribution: goreleaser
                  version: latest
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Helm
              uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
              with:
                  version: v3.14.0

            - name: Update Chart Version
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  sed -i "s/^version:.*/version: ${VERSION}/" charts/kubecrsh/Chart.yaml
                  sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/kubecrsh/Chart.yaml

            - name: Lint Helm Chart
              run: helm lint charts/kubecrsh

            - name: Package Helm Chart
              run: |
                  helm package charts/kubecrsh -d dist/
                  ls -la dist/

            - name: Upload manifests and Helm chart
              uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
              with:
                  files: |
                      manifests/*.yaml
                      dist/*.tgz
                  generate_release_notes: true
