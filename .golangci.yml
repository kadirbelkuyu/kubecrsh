version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    misspell:
      locale: US
    revive:
      confidence: 0.8
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kadirbelkuyu/kubecrsh
  exclusions:
    generated: lax

run:
  timeout: 5m
  tests: true
